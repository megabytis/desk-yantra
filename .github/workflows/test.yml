name: fixture-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --locked
      - run: npm ci && npm run build
      - run: uv run python scripts/check_python.py
      - run: npx playwright install --with-deps chromium
      - run: uv run python tests/browser_probe.py
      - run: uv run python tests/browser_network_probe.py
      - run: uv run python scripts/check_ui.py
