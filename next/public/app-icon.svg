<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Desk Yantra</title>
  <desc id="desc">Desk Yantra geometric diamond emblem on dark tile</desc>
  <defs>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224" /></clipPath>
    <linearGradient id="yantra-accent" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#EBF4EE" />
      <stop offset="50%" stop-color="#C3DFCD" />
      <stop offset="100%" stop-color="#7FA88E" />
    </linearGradient>
    <linearGradient id="inner-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B20" />
      <stop offset="100%" stop-color="#101215" />
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="#101215" />
    <rect x="32" y="32" width="960" height="960" rx="192" fill="none" stroke="#252A32" stroke-width="8" opacity="0.6" />
    <!-- Outer Diamond -->
    <polygon points="512,180 844,512 512,844 180,512" fill="url(#yantra-accent)" />
    <!-- Nested Inner Dark Diamond cutout -->
    <polygon points="512,284 740,512 512,740 284,512" fill="url(#inner-dark)" />
    <!-- Inner Accent Diamond core -->
    <polygon points="512,388 636,512 512,636 388,512" fill="url(#yantra-accent)" />
    <!-- Center core circle -->
    <circle cx="512" cy="512" r="32" fill="#101215" />
  </g>
</svg>
